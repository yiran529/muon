# CM034a: GPT-60M dense AdamW quality control on FineWeb10B.
# The lr=0.001 value is the paired preflight scaffold, not a quality-optimality claim.
model_dim: 512
n_layer: 4
n_head: 8
sequence_length: 256

# Effective local batch 128 on four ranks. The launcher may lower the physical
# device batch and increase gradient accumulation while preserving batch_size=512.
batch_size: 512
device_batch_size: 128
num_iterations: 8393
warmup_ratio: 0.0
warmdown_ratio: 0.2
timing_warmup_steps: 10

val_loss_every: 500
val_tokens: 10485760
checkpoint_freq: 0
wandb_project_name: gpt-train
wandb_job_name: CM034a-dense-adamw-gpt60m-paperlike-train-ddp-ws4-s42
no_wandb: false

dp_size: null
fs_size: null
tp_size: null
debug: false
no_compile: false
no_triton: false

optimizer: adamw
scalar_opt: adamw
weight_decay: 0.01
lr: 0.001
