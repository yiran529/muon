# M001: full ARC-TopK Algorithm 1 + EF21M + Muon, DDP-only first version.

# Model
model_dim: 768
n_layer: 12
n_head: 6
sequence_length: 1024

# Batching and training
batch_size: 1024
device_batch_size: 32
num_iterations: 3000
warmup_ratio: 0.0
warmdown_ratio: 0.2

# Validation, checkpointing, and logging
val_loss_every: 125
val_tokens: 10485760
checkpoint_freq: 0
wandb_project_name: gpt-train
wandb_job_name: m001-arc-topk-muon-ddp
no_wandb: false

# DDP is selected only when all mesh dimensions remain null.
dp_size: null
fs_size: null
tp_size: null
replicate_mesh_grad_sync: true

# Runtime
debug: false
no_compile: false
no_triton: false
use_polar_express: true

# Optimizer
optimizer: arc_topk_muon
scalar_opt: adamw
adjust_lr: spectral_norm
mu: 0.95
weight_decay: 0.01
lr: 0.02

# ARC-TopK Algorithm 1 and EF21M
arc_topk_ratio: 0.2
arc_projection_rank: 4
arc_eta: 0.1
arc_seed: 42
