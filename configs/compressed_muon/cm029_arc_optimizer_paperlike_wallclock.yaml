# CM029/CM030 optimizer-side ARC wall-clock probe. Model shape is overridden
# by the controller for GPT-60M and GPT-130M.
model_dim: 512
n_layer: 4
n_head: 8
sequence_length: 256
batch_size: 512
device_batch_size: 128
num_iterations: 220
timing_warmup_steps: 20
warmup_ratio: 0.0
warmdown_ratio: 0.2
val_loss_every: 0
val_tokens: 131072
checkpoint_freq: 0
no_wandb: true
dp_size: null
fs_size: null
tp_size: null
debug: false
no_compile: false
no_triton: false
use_polar_express: true
optimizer: arc_topk_muon
arc_sync_mode: optimizer
scalar_opt: adamw
adjust_lr: spectral_norm
mu: 0.95
weight_decay: 0.01
lr: 0.02
arc_topk_ratio: 0.2
arc_projection_rank: 4
arc_eta: 1.0
arc_seed: 42
arc_start_compress_step: 0
