# M002: GreedyLore gradient sync with unchanged ordinary Muon, DDP-only.

# Model
model_dim: 1024
n_layer: 20
n_head: 16
sequence_length: 1024

# Batching and training
batch_size: 1024
device_batch_size: 1
num_iterations: 120
timing_warmup_steps: 20
warmup_ratio: 0.0
warmdown_ratio: 0.2
lr_schedule: linear
grad_clip_norm: null

# Validation, checkpointing, and logging
val_loss_every: 0
val_tokens: 4096
checkpoint_freq: 0
wandb_project_name: gpt-train
wandb_job_name: m002-greedy-lore-muon-ddp
no_wandb: true

# DDP is selected only when all mesh dimensions remain null.
dp_size: null
fs_size: null
tp_size: null

# Runtime
debug: false
no_compile: false
no_triton: false
use_polar_express: true
use_gram_newton_schulz: false

# Optimizer
optimizer: greedy_lore_muon
scalar_opt: adamw
adjust_lr: spectral_norm
mu: 0.95
weight_decay: 0.01
lr: 0.02
scalar_lr: 0.002
scalar_adam_beta1: 0.9
scalar_adam_beta2: 0.95
scalar_adam_eps: 1.0e-8
scalar_weight_decay: 0.0

# GreedyLore
greedy_lore_rank: 32
greedy_lore_update_interval: 200
greedy_lore_seed: 42
greedy_lore_start_compress_step: 1000
greedy_lore_basis_sync: local_svd
